<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>market-lab 股票详情</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0;
         background: #f5f6f8; color: #1f2329; }
  header { background: #1f2329; color: #fff; padding: 14px 24px; font-size: 18px;
           display: flex; justify-content: space-between; align-items: center; }
  header .nav { display: flex; align-items: center; gap: 18px; }
  header .nav a { color: #cfd3d9; font-size: 14px; text-decoration: none; }
  header .nav a:hover { color: #fff; }
  header .logout { background: transparent; border: 1px solid #5a5f66; color: #cfd3d9;
                   padding: 5px 12px; font-size: 13px; }
  header .logout:hover { background: #2c3138; }
  .wrap { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  section { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 20px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .topline { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
             margin-bottom: 14px; }
  .topline .back { color: #2f7cf6; font-size: 14px; text-decoration: none; cursor: pointer; }
  .topline .code { font-size: 20px; font-weight: 600; }
  .topline .name { color: #8a8f99; font-size: 13px; }
  .hit-tag { background: #fff3e0; color: #e65100; padding: 2px 8px; border-radius: 3px;
             font-size: 12px; font-weight: 500; }

  /* KlineRender 注入的 DOM 用 kr- 前缀样式 */
  .kr-tabs { display: flex; gap: 0; border-bottom: 1px solid #eee; margin-bottom: 14px; }
  .kr-tab { padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent;
            color: #8a8f99; }
  .kr-tab.active { border-bottom-color: #2f7cf6; color: #2f7cf6; font-weight: 500; }
  .kr-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .kr-btn-group { display: flex; border: 1px solid #dcdfe6; border-radius: 6px; overflow: hidden; }
  .kr-btn-group button { background: #fff; color: #1f2329; border: 0; padding: 5px 14px;
                         cursor: pointer; font-size: 13px; }
  .kr-btn-group button.active { background: #2f7cf6; color: #fff; }
  .kr-muted { color: #8a8f99; font-size: 12px; }
  .kr-chart { width: 100%; height: 600px; }
  .kr-empty { text-align: center; color: #8a8f99; padding: 80px 0; }
  .kr-minute-day { padding: 5px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<header><span>market-lab 股票详情</span>
  <div class="nav">
    <a href="/dashboard">管理面板</a>
    <a href="/kline">K线查询</a>
    <a href="/analysis">分析选股</a>
    <a href="/analysis/strategies">策略管理</a>
    <a href="/analysis/run">策略执行</a>
    <a href="/settings">运行设置</a>
    <button class="logout" onclick="logout()">退出登录</button>
  </div>
</header>
<div class="wrap">
  <div class="topline">
    <a class="back" id="backLink" href="/analysis">← 返回</a>
    <span class="code" id="stockCode"></span>
    <span class="name" id="stockName"></span>
    <span class="hit-tag" id="hitTag" style="display:none"></span>
  </div>

  <section>
    <div id="klineMount"></div>
  </section>
</div>

<script src="/static/echarts.min.js"></script>
<script src="/static/kline-render.js"></script>
<script>
function getToken() { return localStorage.getItem('token') || ''; }

function gotoLogin() {
  localStorage.removeItem('token');
  location.replace('/login');
}

if (!getToken()) gotoLogin();

function logout() { gotoLogin(); }

const params = new URLSearchParams(location.search);
const code = document.getElementById('stockCode').textContent =
  location.pathname.replace('/stock/', '').replace(/\/$/, '');
const hitDay = params.get('day');
if (hitDay) {
  const tag = document.getElementById('hitTag');
  tag.textContent = '策略命中 ' + hitDay;
  tag.style.display = 'inline-block';
}
const backLink = document.getElementById('backLink');
if (hitDay) backLink.href = '/analysis?day=' + hitDay;

// 取股票名(命中失败不阻塞)
fetch('/api/stocks?limit=500', { headers: { 'Authorization': 'Bearer ' + getToken() } })
  .then(r => r.ok ? r.json() : null)
  .then(res => {
    if (!res) return;
    const hit = (res.data || []).find(s => s.stock_code === code);
    if (hit) document.getElementById('stockName').textContent = hit.stock_name;
  })
  .catch(() => {});

KlineRender.mountKline(document.getElementById('klineMount'), {
  code,
  hitDay,
  defaultRangeDays: 180,
}).loadInitial();
</script>
</body>
</html>
