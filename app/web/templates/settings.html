<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>market-lab 系统设置</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0;
         background: #f5f6f8; color: #1f2329; }
  header { background: #1f2329; color: #fff; padding: 14px 24px; font-size: 18px;
           display: flex; justify-content: space-between; align-items: center; }
  header .nav { display: flex; align-items: center; gap: 18px; }
  header .nav a { color: #cfd3d9; font-size: 14px; text-decoration: none; }
  header .nav a:hover { color: #fff; }
  header .logout { background: transparent; border: 1px solid #5a5f66; color: #cfd3d9;
                   padding: 5px 12px; font-size: 13px; }
  header .logout:hover { background: #2c3138; }
  .wrap { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  section { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 20px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  button { background: #2f7cf6; color: #fff; border: 0; padding: 6px 14px;
           border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: #1f6ae0; }
  .muted { color: #8a8f99; font-size: 12px; }
  .stat-row { display: flex; gap: 20px; margin-bottom: 12px; font-size: 12px; }
  .stat-item { flex: 1; }
  .stat-label { color: #8a8f99; margin-bottom: 2px; }
  .stat-value { color: #1f2329; font-weight: 500; }
  .filters { display: flex; gap: 10px; margin-bottom: 12px; }
  .filters input { padding: 6px 10px; border: 1px solid #dcdfe6;
                   border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<header><span>market-lab 系统设置</span>
  <div class="nav">
    <a href="/dashboard">管理面板</a>
    <button class="logout" onclick="logout()">退出登录</button>
  </div>
</header>
<div class="wrap">
  <section>
    <h2>运行时配置 <span class="muted" id="tuningUpdated" style="font-weight:400"></span></h2>
    <div class="muted" style="margin-bottom:12px">QPS / worker 数 / tick 间隔存数据库,改完 ≤1 个 tick 生效,无需重启容器。范围护栏见各项括号说明。</div>
    <div class="stat-row" id="tuningStats"></div>
    <div class="filters" style="align-items:center; flex-wrap:wrap; gap:14px;">
      <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;">QPS
        <input id="cfg-akshare_qps" type="number" step="0.5" style="width:90px"></label>
      <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;">非交易 worker
        <input id="cfg-offhour_workers" type="number" step="1" style="width:90px"></label>
      <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;">交易 worker
        <input id="cfg-intraday_workers" type="number" step="1" style="width:90px"></label>
      <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;">tick 间隔(秒)
        <input id="cfg-tick_interval_sec" type="number" step="1" style="width:90px"></label>
      <button onclick="applyConfig()">应用</button>
      <span class="muted" id="applyMsg"></span>
    </div>
  </section>

  <section>
    <h2>吞吐观测</h2>
    <svg id="throughputChart" viewBox="0 0 800 150" width="100%" height="150"
         preserveAspectRatio="none" style="display:block;"></svg>
    <div class="muted" id="throughputText" style="margin-top:4px"></div>
  </section>
</div>

<script>
function getToken() { return localStorage.getItem('token') || ''; }

function gotoLogin() {
  localStorage.removeItem('token');
  location.replace('/login');
}

// 无 token 直接回登录页,避免空跑一圈请求
if (!getToken()) gotoLogin();

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, {
    'Authorization': 'Bearer ' + getToken(),
  });
  const r = await fetch(path, opts);
  if (r.status === 401) { gotoLogin(); throw new Error('未授权'); }
  // 滑动续期:服务端每次有效响应都回发新 token
  const refreshed = r.headers.get('X-Refresh-Token');
  if (refreshed) localStorage.setItem('token', refreshed);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function logout() { gotoLogin(); }

function formatTime(d) {
  if (!d) return '-';
  if (typeof d === 'string') {
    const dt = new Date(d);
    return dt.toLocaleString('zh-CN', {hour12: false});
  }
  return d.toLocaleString('zh-CN', {hour12: false});
}

const CFG_LABELS = {
  'akshare_qps': 'QPS',
  'offhour_workers': '非交易 worker',
  'intraday_workers': '交易 worker',
  'tick_interval_sec': 'tick 间隔(秒)',
};
let _cfg = {};  // key -> {effective,min,max,updated_at,updated_by}

async function loadTuning() {
  const d = await api('/api/config');
  _cfg = {};
  d.data.forEach(c => { _cfg[c.key] = c; });
  document.getElementById('tuningStats').innerHTML = d.data.map(c =>
    `<div class="stat-item"><div class="stat-label">${CFG_LABELS[c.key] || c.key}</div>` +
    `<div class="stat-value">${c.effective} <span class="muted">(${c.min}~${c.max})</span></div></div>`
  ).join('');
  d.data.forEach(c => {
    const el = document.getElementById('cfg-' + c.key);
    if (!el) return;
    el.min = c.min; el.max = c.max;
    if (document.activeElement !== el) el.value = c.effective;
  });
  const latest = d.data.filter(c => c.updated_at)
    .sort((a, b) => b.updated_at.localeCompare(a.updated_at))[0];
  document.getElementById('tuningUpdated').textContent =
    latest ? `（最近调整 ${formatTime(latest.updated_at)} by ${latest.updated_by || '-'}）` : '';
}

function showApplyMsg(msg, ok) {
  const el = document.getElementById('applyMsg');
  el.textContent = msg;
  el.style.color = ok ? '#2e7d32' : '#c62828';
}

async function applyConfig() {
  const payload = {};
  for (const k of Object.keys(CFG_LABELS)) {
    const el = document.getElementById('cfg-' + k);
    const v = parseFloat(el.value);
    if (isNaN(v)) continue;
    if (_cfg[k] && v !== Number(_cfg[k].effective)) payload[k] = el.value;
  }
  if (!Object.keys(payload).length) { showApplyMsg('无改动', false); return; }
  showApplyMsg('应用中…', true);
  try {
    await api('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    showApplyMsg('已应用,≤1 个 tick(默认 10s)后生效', true);
    setTimeout(loadTuning, 3000);  // 读回确认生效
  } catch (e) {
    let detail = e.message;
    try { detail = JSON.parse(e.message).detail || detail; } catch (_) {}
    showApplyMsg('失败: ' + detail, false);
  }
}

async function loadThroughput() {
  const d = await api('/api/metrics/throughput');
  renderChart(d.buckets || []);
  const s = d.last_1h || {};
  document.getElementById('throughputText').textContent =
    `最近 1h:成功 ${s.success || 0} · 失败 ${s.failure || 0}(失败率 ${s.failure_rate_pct || 0}%)` +
    ` · 折算 ${d.hourly_rate || 0} 任务/h · 平均耗时 ${s.avg_latency_ms || 0} ms` +
    ` · 蓝=成功 红=失败(5 分钟/桶,最近 1h)`;
}

function renderChart(buckets) {
  const svg = document.getElementById('throughputChart');
  const last = buckets.slice(-12);
  const W = 800, H = 150, padX = 10, padY = 16;
  if (!last.length) {
    svg.innerHTML = `<text x="400" y="80" text-anchor="middle" fill="#8a8f99" font-size="13">` +
      `暂无吞吐数据(启动后开始累计)</text>`;
    return;
  }
  const max = Math.max(1, ...last.map(b => (b.success || 0) + (b.failure || 0)));
  const slot = (W - 2 * padX) / 12;
  const barW = Math.max(8, slot * 0.6);
  const yOf = v => H - padY - (v / max) * (H - 2 * padY);
  let s = '';
  [0, max].forEach(v => {
    s += `<line x1="${padX}" y1="${yOf(v)}" x2="${W - padX}" y2="${yOf(v)}" stroke="#e8eaed"/>` +
         `<text x="${W - padX}" y="${yOf(v) - 4}" text-anchor="end" font-size="10" fill="#8a8f99">${v}</text>`;
  });
  last.forEach((b, i) => {
    const x = padX + i * slot + (slot - barW) / 2;
    const yBase = H - padY;
    const hSuc = (b.success || 0) / max * (H - 2 * padY);
    const hFail = (b.failure || 0) / max * (H - 2 * padY);
    let bars = '';
    if (b.success) bars += `<rect x="${x}" y="${yBase - hSuc}" width="${barW}" height="${hSuc}" fill="#2f7cf6"/>`;
    if (b.failure) bars += `<rect x="${x}" y="${yBase - hSuc - hFail}" width="${barW}" height="${hFail}" fill="#e57373"/>`;
    const t = new Date(b.bucket_ts * 1000);
    s += `<g><title>${t.toLocaleTimeString('zh-CN', {hour12: false})} ` +
         `成功 ${b.success || 0} · 失败 ${b.failure || 0} · 平均 ${b.avg_latency_ms || 0}ms</title>${bars}</g>`;
  });
  svg.innerHTML = s;
}

async function refresh() {
  try {
    await Promise.all([loadTuning(), loadThroughput()]);
  } catch (e) {
    console.error(e);
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
