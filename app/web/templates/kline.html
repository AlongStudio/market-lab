<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>market-lab K线查询</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0;
         background: #f5f6f8; color: #1f2329; }
  header { background: #1f2329; color: #fff; padding: 14px 24px; font-size: 18px;
           display: flex; justify-content: space-between; align-items: center; }
  header .nav { display: flex; align-items: center; gap: 18px; }
  header .nav a { color: #cfd3d9; font-size: 14px; text-decoration: none; }
  header .nav a:hover { color: #fff; }
  header .logout { background: transparent; border: 1px solid #5a5f66; color: #cfd3d9;
                   padding: 5px 12px; font-size: 13px; }
  header .logout:hover { background: #2c3138; }
  .wrap { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  section { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 20px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .muted { color: #8a8f99; font-size: 12px; }
  .searched { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .searched .code { font-size: 18px; font-weight: 600; }
  .searched .name { color: #8a8f99; font-size: 13px; }

  .stock-search { position: relative; margin-bottom: 12px; max-width: 480px; }
  .stock-search input {
    width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 6px;
    font-size: 14px; outline: none;
  }
  .stock-search input:focus { border-color: #2f7cf6; }
  .suggest-list, .default-list {
    position: absolute; top: 100%; left: 0; right: 0; background: #fff;
    border: 1px solid #dcdfe6; border-radius: 6px; max-height: 360px; overflow-y: auto;
    z-index: 10; box-shadow: 0 4px 12px rgba(0,0,0,.08);
  }
  .suggest-item, .default-item {
    display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; cursor: pointer;
    font-size: 13px; border-bottom: 1px solid #f0f2f5;
  }
  .suggest-item:last-child, .default-item:last-child { border-bottom: 0; }
  .suggest-item:hover, .suggest-item.highlighted,
  .default-item:hover, .default-item.highlighted { background: #f5f8ff; }
  .suggest-item .s-code, .default-item .s-code { font-weight: 600; min-width: 90px; }
  .suggest-item .s-name, .default-item .s-name { color: #1f2329; flex: 1; }
  .suggest-item .s-pinyin, .default-item .s-pinyin { color: #b3b8c2; font-size: 12px; }
  .default-list-wrap { margin-bottom: 12px; }
  .default-list-wrap .default-list { position: static; box-shadow: none; border-color: #f0f2f5; }
  .default-list-title { color: #8a8f99; font-size: 12px; margin-bottom: 6px; }

  .kr-tabs { display: flex; gap: 0; border-bottom: 1px solid #eee; margin-bottom: 14px; }
  .kr-tab { padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent;
            color: #8a8f99; }
  .kr-tab.active { border-bottom-color: #2f7cf6; color: #2f7cf6; font-weight: 500; }
  .kr-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .kr-btn-group { display: flex; border: 1px solid #dcdfe6; border-radius: 6px; overflow: hidden; }
  .kr-btn-group button { background: #fff; color: #1f2329; border: 0; padding: 5px 14px;
                         cursor: pointer; font-size: 13px; }
  .kr-btn-group button.active { background: #2f7cf6; color: #fff; }
  .kr-muted { color: #8a8f99; font-size: 12px; }
  .kr-chart { width: 100%; height: 600px; }
  .kr-empty { text-align: center; color: #8a8f99; padding: 80px 0; }
  .kr-minute-day { padding: 5px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<header><span>market-lab K线查询</span>
  <div class="nav">
    <a href="/dashboard">管理面板</a>
    <a href="/analysis">分析选股</a>
    <a href="/analysis/strategies">策略管理</a>
    <a href="/analysis/run">策略执行</a>
    <a href="/settings">运行设置</a>
    <button class="logout" onclick="logout()">退出登录</button>
  </div>
</header>
<div class="wrap">
  <section>
    <div class="stock-search">
      <input id="stockInput" placeholder="代码/名称/拼音首字母(如 zgpa / 600519 / 贵州茅台)" autocomplete="off">
      <div id="suggestList" class="suggest-list" style="display:none"></div>
    </div>
    <div id="defaultListWrap" class="default-list-wrap">
      <div class="default-list-title">股票清单(点击加载 K 线)</div>
      <div id="defaultList" class="default-list"></div>
    </div>

    <div class="searched" id="searched" style="display:none">
      <span class="code" id="showCode"></span>
      <span class="name" id="showName"></span>
      <a class="muted" id="openDetail" style="display:none">打开详情页 →</a>
    </div>

    <div id="klineMount"></div>
  </section>
</div>

<script src="/static/echarts.min.js"></script>
<script src="/static/kline-render.js"></script>
<script>
function getToken() { return localStorage.getItem('token') || ''; }

function gotoLogin() {
  localStorage.removeItem('token');
  location.replace('/login');
}

if (!getToken()) gotoLogin();

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, {
    'Authorization': 'Bearer ' + getToken(),
  });
  const r = await fetch(path, opts);
  if (r.status === 401) { gotoLogin(); throw new Error('未授权'); }
  const refreshed = r.headers.get('X-Refresh-Token');
  if (refreshed) localStorage.setItem('token', refreshed);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function logout() { gotoLogin(); }

const esc = KlineRender.esc;

const state = {
  code: '',
  stocks: [],
  controller: null,
  highlightIdx: -1,
  lastInput: '',
};

const input = document.getElementById('stockInput');
const suggestList = document.getElementById('suggestList');
const defaultListWrap = document.getElementById('defaultListWrap');
const defaultList = document.getElementById('defaultList');

function renderItems(list, target) {
  if (!list.length) {
    target.innerHTML = '<div class="muted" style="padding:8px 12px">无匹配股票</div>';
    return;
  }
  target.innerHTML = list.map((s, i) =>
    `<div class="${target === defaultList ? 'default-item' : 'suggest-item'}" data-idx="${i}" data-code="${esc(s.stock_code)}">` +
      `<span class="s-code">${esc(s.stock_code)}</span>` +
      `<span class="s-name">${esc(s.stock_name)}</span>` +
      `<span class="s-pinyin">${esc(s.pinyin_initials || '')}</span>` +
    `</div>`
  ).join('');
  target.querySelectorAll('[data-code]').forEach(el => {
    el.addEventListener('click', () => selectStock(el.dataset.code));
  });
}

function itemFromTarget(target, list) {
  const idx = parseInt(target.dataset.idx, 10);
  if (Number.isNaN(idx) || idx < 0 || idx >= list.length) return null;
  return list[idx];
}

let debounceTimer = null;
function onInput() {
  const v = input.value.trim();
  state.lastInput = v;
  state.highlightIdx = -1;
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(async () => {
    try {
      const url = v
        ? `/api/stocks?keyword=${encodeURIComponent(v)}&limit=20`
        : `/api/stocks?limit=20`;
      const res = await api(url);
      const list = res.data || [];
      if (v) {
        defaultListWrap.style.display = 'none';
        suggestList.style.display = 'block';
        state.stocks = list;
        renderItems(list, suggestList);
      } else {
        suggestList.style.display = 'none';
        defaultListWrap.style.display = 'block';
        state.stocks = list;
        renderItems(list, defaultList);
      }
    } catch (e) {
      // 静默失败,不打断输入
    }
  }, 200);
}

function onKeydown(e) {
  const list = state.stocks;
  if (!list.length) return;
  if (suggestList.style.display === 'none') return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    state.highlightIdx = (state.highlightIdx + 1) % list.length;
    updateHighlight();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    state.highlightIdx = (state.highlightIdx - 1 + list.length) % list.length;
    updateHighlight();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (state.highlightIdx >= 0 && state.highlightIdx < list.length) {
      selectStock(list[state.highlightIdx].stock_code);
    } else if (list.length) {
      selectStock(list[0].stock_code);
    }
  } else if (e.key === 'Escape') {
    suggestList.style.display = 'none';
  }
}

function updateHighlight() {
  suggestList.querySelectorAll('.suggest-item').forEach((el, i) => {
    el.classList.toggle('highlighted', i === state.highlightIdx);
  });
}

function selectStock(code) {
  if (!code) return;
  state.code = code;
  input.value = '';
  suggestList.style.display = 'none';
  defaultListWrap.style.display = 'none';
  loadSelected(code);
}

async function loadSelected(code) {
  const stock = state.stocks.find(s => s.stock_code === code);
  // 若选中不在当前列表,补一次查询拿名字
  let name = stock ? stock.stock_name : '';
  if (!name) {
    try {
      const res = await api(`/api/stocks?keyword=${encodeURIComponent(code)}&limit=20`);
      const hit = (res.data || []).find(s => s.stock_code === code);
      if (hit) name = hit.stock_name;
    } catch (e) {}
  }
  document.getElementById('searched').style.display = 'flex';
  document.getElementById('showCode').textContent = code;
  document.getElementById('showName').textContent = name;
  const link = document.getElementById('openDetail');
  link.href = '/stock/' + encodeURIComponent(code);
  link.style.display = 'inline-block';

  if (state.controller) { state.controller.dispose(); state.controller = null; }
  state.controller = KlineRender.mountKline(document.getElementById('klineMount'), { code });
  state.controller.loadInitial();
}

input.addEventListener('input', onInput);
input.addEventListener('keydown', onKeydown);
input.addEventListener('blur', () => {
  setTimeout(() => { suggestList.style.display = 'none'; }, 150);
});
input.addEventListener('focus', () => {
  if (state.lastInput === '' && defaultList.children.length) {
    defaultListWrap.style.display = 'block';
  }
});

window.addEventListener('resize', () => {
  if (state.controller && state.controller._resize) state.controller._resize();
});

// 初始加载默认清单
onInput();
</script>
</body>
</html>
